version: "3.9"

services:
  ihd:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    env_file:
      - ../.env
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - minio
    environment:
      IHD_HOST: 0.0.0.0
      IHD_PORT: 8787
      IHD_SECURE_COOKIE: "1"
      IHD_TURN_USERNAME: "${IHD_TURN_USERNAME}"
      IHD_TURN_PASSWORD: "${IHD_TURN_PASSWORD}"
      IHD_MASTER_EMAIL: "${IHD_MASTER_EMAIL}"
      IHD_MASTER_PASSWORD: "${IHD_MASTER_PASSWORD}"
      IHD_MASTER_NAME: "${IHD_MASTER_NAME}"
    volumes:
      - ihd_data:/app/data
    networks:
      - ihd_private

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ihd
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["ihd_pg:/var/lib/postgresql/data"]
    networks: [ihd_private]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes"]
    volumes: ["ihd_redis:/data"]
    networks: [ihd_private]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: ["ihd_storage:/data"]
    networks: [ihd_private]

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes: ["./livekit.yaml:/etc/livekit.yaml:ro"]
    ports: ["7880:7880","7881:7881","50000-50100:50000-50100/udp"]
    networks: [ihd_private]

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    ports: ["3478:3478/tcp","3478:3478/udp","49160-49200:49160-49200/udp"]
    networks: [ihd_private]

  caddy:
    image: caddy:latest
    restart: unless-stopped
    depends_on:
      - ihd
    env_file:
      - ../.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - ihd_private

networks:
  ihd_private: {driver: bridge}

volumes:
  ihd_pg: {}
  ihd_redis: {}
  ihd_storage: {}
  ihd_data: {}
  caddy_data: {}
  caddy_config: {}
