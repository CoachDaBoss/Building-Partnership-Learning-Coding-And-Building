services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ihd
      POSTGRES_USER: ihd
      POSTGRES_PASSWORD: CHANGE_ME
    volumes: ["ihd_pg:/var/lib/postgresql/data"]
    networks: [ihd_private]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes"]
    volumes: ["ihd_redis:/data"]
    networks: [ihd_private]
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: CHANGE_ME
      MINIO_ROOT_PASSWORD: CHANGE_ME_STRONG
    volumes: ["ihd_storage:/data"]
    networks: [ihd_private]
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes: ["./livekit.yaml:/etc/livekit.yaml:ro"]
    ports: ["7880:7880","7881:7881","50000-50100:50000-50100/udp"]
    networks: [ihd_private]
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    ports: ["3478:3478/tcp","3478:3478/udp","49160-49200:49160-49200/udp"]
    networks: [ihd_private]
networks:
  ihd_private: {driver: bridge}
volumes:
  ihd_pg: {}
  ihd_redis: {}
  ihd_storage: {}
